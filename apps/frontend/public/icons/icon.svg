<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Map pin icon -->
  <g transform="translate(136, 80)">
    <!-- Pin body -->
    <path d="M120 384c0 66.3-53.7 120-120 120S0 450.3 0 384c0-66.3 53.7-120 120-120s120 53.7 120 120z" 
          fill="white" opacity="0.9"/>
    <path d="M120 384c0 66.3-53.7 120-120 120S0 450.3 0 384c0-66.3 53.7-120 120-120s120 53.7 120 120z" 
          fill="none" stroke="#0ea5e9" stroke-width="4"/>
    <!-- Inner circle -->
    <circle cx="120" cy="264" r="48" fill="#0ea5e9"/>
    <circle cx="120" cy="264" r="24" fill="white"/>
    <!-- Location dot -->
    <circle cx="120" cy="264" r="8" fill="#0ea5e9"/>
  </g>
  
  <!-- Decorative elements - small building icons -->
  <g fill="white" opacity="0.2">
    <rect x="80" y="380" width="60" height="100" rx="4"/>
    <rect x="100" y="400" width="20" height="15" rx="2"/>
    <rect x="100" y="430" width="20" height="15" rx="2"/>
    <rect x="100" y="460" width="20" height="15" rx="2"/>
    
    <rect x="372" y="380" width="60" height="100" rx="4"/>
    <rect x="392" y="400" width="20" height="15" rx="2"/>
    <rect x="392" y="430" width="20" height="15" rx="2"/>
    <rect x="392" y="460" width="20" height="15" rx="2"/>
    
    <rect x="160" y="420" width="40" height="60" rx="4"/>
    <rect x="172" y="435" width="16" height="12" rx="2"/>
    <rect x="172" y="460" width="16" height="12" rx="2"/>
    
    <rect x="312" y="420" width="40" height="60" rx="4"/>
    <rect x="324" y="435" width="16" height="12" rx="2"/>
    <rect x="324" y="460" width="16" height="12" rx="2"/>
  </g>
  
  <!-- Transit line -->
  <path d="M60 300 Q150 250 256 280 Q362 310 452 260" 
        stroke="white" stroke-width="3" fill="none" opacity="0.3" 
        stroke-dasharray="10,5"/>
  
  <!-- Small transit stops on line -->
  <g fill="white" opacity="0.4">
    <circle cx="90" cy="285" r="5"/>
    <circle cx="180" cy="265" r="5"/>
    <circle cx="256" cy="280" r="5"/>
    <circle cx="340" cy="275" r="5"/>
    <circle cx="420" cy="265" r="5"/>
  </g>
</svg>
