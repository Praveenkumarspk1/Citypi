apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alerts@smartcity.example.com'
      smtp_auth_username: 'alerts@smartcity.example.com'
      smtp_auth_password: '${SMTP_PASSWORD}'
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-alerts'
          continue: true
        - match:
            team: platform
          receiver: 'platform-alerts'
    
    receivers:
      - name: 'default'
        email_configs:
          - to: 'team@smartcity.example.com'
            send_resolved: true
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            channel: '#alerts'
            send_resolved: true
            title: 'AI Smart City Alert'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
      
      - name: 'critical-alerts'
        email_configs:
          - to: 'oncall@smartcity.example.com'
            send_resolved: true
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            channel: '#critical-alerts'
            send_resolved: true
            title: 'CRITICAL: AI Smart City Alert'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_KEY}'
            severity: critical
      
      - name: 'warning-alerts'
        email_configs:
          - to: 'team@smartcity.example.com'
            send_resolved: true
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            channel: '#warning-alerts'
            send_resolved: true
            title: 'WARNING: AI Smart City Alert'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
      
      - name: 'platform-alerts'
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            channel: '#platform-alerts'
            send_resolved: true
            title: 'Platform Alert'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
    
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'cluster', 'service']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.26.0
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
            - '--web.external-url=http://alertmanager.monitoring.svc.cluster.local:9093'
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
  selector:
    app: alertmanager