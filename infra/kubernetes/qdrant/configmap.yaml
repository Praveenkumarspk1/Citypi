apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-config
  namespace: qdrant
data:
  config.yaml:
    log_level: INFO
    service:
      host: 0.0.0.0
      http_port: 6333
      grpc_port: 6334
    storage:
      storage_path: /qdrant/storage
      snapshots_path: /qdrant/snapshots
    hnsw_index:
      m: 16
      ef_construct: 100
      full_scan_threshold: 10000
