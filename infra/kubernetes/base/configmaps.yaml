apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: ai-smart-city-concierge
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DATABASE_URL: "postgresql://postgres:password@postgres:5432/ai_smart_city"
  REDIS_URL: "redis://redis:6379/0"
  VECTOR_STORE_URL: "http://qdrant:6333"
  EMBEDDING_MODEL: "bge-m3"
  LLM_MODEL: "gemini-pro"
  CORS_ORIGINS: "https://app.smartcity.example.com"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: ai-smart-city-concierge
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  DATABASE_URL: "postgresql://postgres:password@postgres:5432/ai_smart_city"
  REDIS_URL: "redis://redis:6379/0"
  VECTOR_STORE_URL: "http://qdrant:6333"
  EMBEDDING_MODEL: "bge-m3"
  LLM_MODEL: "gemini-pro"
  WORKER_CONCURRENCY: "4"
  TASK_QUEUE_NAME: "default"
  SCHEDULER_ENABLED: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-config
  namespace: ai-smart-city-concierge
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  WS_HOST: "0.0.0.0"
  WS_PORT: "8001"
  REDIS_URL: "redis://redis:6379/0"
  MESSAGE_BROKER_URL: "redis://redis:6379/1"
  MAX_CONNECTIONS: "10000"
  HEARTBEAT_INTERVAL: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: ai-smart-city-concierge
data:
  VITE_API_URL: "https://api.smartcity.example.com"
  VITE_WS_URL: "wss://ws.smartcity.example.com"
  VITE_APP_NAME: "AI Smart City Concierge"
  VITE_MAP_PROVIDER: "openstreetmap"
  VITE_DEFAULT_CENTER_LAT: "40.7128"
  VITE_DEFAULT_CENTER_LNG: "-74.0060"
  VITE_DEFAULT_ZOOM: "12"