apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-smart-city-concierge-ingress
  namespace: ai-smart-city-concierge
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.smartcity.example.com
        - app.smartcity.example.com
        - ws.smartcity.example.com
      secretName: ai-smart-city-concierge-tls
  rules:
    # API Ingress
    - host: api.smartcity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    
    # Frontend Ingress
    - host: app.smartcity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    
    # WebSocket Ingress
    - host: ws.smartcity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: websocket
                port:
                  number: 8001