apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service-account
  namespace: ai-smart-city-concierge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-service-account
  namespace: ai-smart-city-concierge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: websocket-service-account
  namespace: ai-smart-city-concierge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-service-account
  namespace: ai-smart-city-concierge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/federate"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: ai-smart-city-concierge
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-configmap-reader
  namespace: ai-smart-city-concierge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-reader
subjects:
  - kind: ServiceAccount
    name: api-service-account
    namespace: ai-smart-city-concierge
  - kind: ServiceAccount
    name: worker-service-account
    namespace: ai-smart-city-concierge
  - kind: ServiceAccount
    name: websocket-service-account
    namespace: ai-smart-city-concierge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: ai-smart-city-concierge
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-secret-reader
  namespace: ai-smart-city-concierge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - kind: ServiceAccount
    name: api-service-account
    namespace: ai-smart-city-concierge
  - kind: ServiceAccount
    name: worker-service-account
    namespace: ai-smart-city-concierge
  - kind: ServiceAccount
    name: websocket-service-account
    namespace: ai-smart-city-concierge