[project]
name = "shared-types"
version = "0.1.0"
description = "Shared type definitions for AI Smart City Concierge"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[tool.poetry]
name = "shared-types"
version = "0.1.0"
description = "Shared type definitions for AI Smart City Concierge"
authors = ["Your Name <your.email@example.com>"]
packages = [
    {include = "shared_types", from = "python"},
]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
python-dateutil = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
mypy = "^1.8.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"