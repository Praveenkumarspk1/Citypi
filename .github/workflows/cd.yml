name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push API image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/api:${{ github.sha }} -f docker/Dockerfile.api .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/api:${{ github.sha }}

      - name: Build and push Worker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/worker:${{ github.sha }} -f docker/Dockerfile.worker .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/worker:${{ github.sha }}

      - name: Build and push WebSocket image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/websocket:${{ github.sha }} -f docker/Dockerfile.websocket .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/websocket:${{ github.sha }}

      - name: Build and push Frontend image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/frontend:${{ github.sha }} -f docker/Dockerfile.frontend .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/frontend:${{ github.sha }}

      - name: Deploy to Cloud Run (Staging)
        run: |
          gcloud run deploy concierge-api-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/api:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=staging \
            --service-account=${{ env.SERVICE_ACCOUNT }}

          gcloud run deploy concierge-worker-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/worker:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=staging \
            --service-account=${{ env.SERVICE_ACCOUNT }}

          gcloud run deploy concierge-websocket-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/websocket:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=staging \
            --service-account=${{ env.SERVICE_ACCOUNT }}

          gcloud run deploy concierge-frontend-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=staging \
            --service-account=${{ env.SERVICE_ACCOUNT }}

      - name: Run database migrations (Staging)
        run: |
          gcloud run jobs execute concierge-migrate-staging \
            --region=${{ env.REGION }} \
            --wait || true

      - name: Health check staging
        run: |
          sleep 30
          curl -f https://concierge-api-staging-${{ env.REGION }}.run.app/health/ready
          curl -f https://concierge-websocket-staging-${{ env.REGION }}.run.app/health/ready

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push API image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/api:${{ github.ref_name }} -f docker/Dockerfile.api .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/api:${{ github.ref_name }}

      - name: Build and push Worker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/worker:${{ github.ref_name }} -f docker/Dockerfile.worker .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/worker:${{ github.ref_name }}

      - name: Build and push WebSocket image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/websocket:${{ github.ref_name }} -f docker/Dockerfile.websocket .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/websocket:${{ github.ref_name }}

      - name: Build and push Frontend image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/frontend:${{ github.ref_name }} -f docker/Dockerfile.frontend .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/frontend:${{ github.ref_name }}

      - name: Deploy to Cloud Run (Production)
        run: |
          gcloud run deploy concierge-api \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/api:${{ github.ref_name }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=production \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --min-instances=1 \
            --max-instances=100

          gcloud run deploy concierge-worker \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/worker:${{ github.ref_name }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=production \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --min-instances=1 \
            --max-instances=10

          gcloud run deploy concierge-websocket \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/websocket:${{ github.ref_name }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=production \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --min-instances=1 \
            --max-instances=50

          gcloud run deploy concierge-frontend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/concierge/frontend:${{ github.ref_name }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=production \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --min-instances=1 \
            --max-instances=10

      - name: Run database migrations (Production)
        run: |
          gcloud run jobs execute concierge-migrate \
            --region=${{ env.REGION }} \
            --wait

      - name: Health check production
        run: |
          sleep 30
          curl -f https://concierge-api-${{ env.REGION }}.run.app/health/ready
          curl -f https://concierge-websocket-${{ env.REGION }}.run.app/health/ready

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true