name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Run Ruff (lint)
        run: |
          poetry run ruff check apps/api/src apps/worker/src apps/websocket/src
          poetry run ruff format --check apps/api/src apps/worker/src apps/websocket/src

      - name: Run Pyright (type check)
        run: poetry run pyright apps/api/src apps/worker/src apps/websocket/src

      - name: Run Bandit (security)
        run: poetry run bandit -r apps/api/src apps/worker/src apps/websocket/src -f json -o bandit-report.json || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: concierge_test
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      chromadb:
        image: chromadb/chroma:0.5.5
        ports:
          - 8002:8000
        options: --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Set up test environment
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/worker/.env.example apps/worker/.env
          cp apps/websocket/.env.example apps/websocket/.env
        env:
          DATABASE_URL: postgresql+asyncpg://concierge:test_password@localhost:5432/concierge_test
          REDIS_URL: redis://localhost:6379/0
          CHROMADB_HOST: localhost
          CHROMADB_PORT: 8002

      - name: Run database migrations
        run: poetry run alembic upgrade head
        working-directory: apps/api

      - name: Run tests
        run: |
          poetry run pytest apps/api/tests apps/worker/tests apps/websocket/tests -v --tb=short --cov=apps/api/src --cov=apps/worker/src --cov=apps/websocket/src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-lint-and-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: apps/frontend

      - name: Run TypeScript check
        run: npm run typecheck
        working-directory: apps/frontend

      - name: Run tests
        run: npm run test -- --coverage
        working-directory: apps/frontend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, frontend-lint-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: concierge-api:test
          load: true

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: concierge-worker:test
          load: true

      - name: Build WebSocket image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.websocket
          push: false
          tags: concierge-websocket:test
          load: true

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: concierge-frontend:test
          load: true

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for services
        run: |
          sleep 30
          curl -f http://localhost:8000/health/live
          curl -f http://localhost:8001/health/live
          curl -f http://localhost:3000

      - name: Run API health checks
        run: |
          curl -f http://localhost:8000/health/ready
          curl -f http://localhost:8000/api/v1/health

      - name: Run WebSocket health checks
        run: curl -f http://localhost:8001/health/ready

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v