name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all services
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # ssh ${{ secrets.PROD_SSH }} "
          #   cd /opt/concierge-prod &&
          #   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml pull &&
          #   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
          # "

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          # sleep 30
          # curl -f https://api.concierge.city/health || exit 1

      - name: Notify deployment
        if: success()
        run: echo "Production deployment successful: ${{ github.sha }}"
