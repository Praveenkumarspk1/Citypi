services:
  # ==========================================
  # DATABASE LAYER
  # ==========================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: concierge-postgres
    environment:
      POSTGRES_DB: concierge
      POSTGRES_USER: concierge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concierge_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concierge -d concierge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: concierge-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ==========================================
  # VECTOR DATABASE
  # ==========================================
  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: concierge-chromadb
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      ANONYMIZED_TELEMETRY: "False"
      ALLOW_RESET: "True"
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ==========================================
  # OBJECT STORAGE (S3-compatible)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: concierge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ==========================================
  # APPLICATION SERVICES
  # ==========================================
  api:
    build:
      context: ../apps/api
      dockerfile: ../../docker/Dockerfile.api
    container_name: concierge-api
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://concierge:concierge_dev_password@postgres:5432/concierge
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=concierge-media
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - LOG_LEVEL=DEBUG
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - ../apps/api:/app
      - prometheus_data:/tmp/prometheus
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  worker:
    build:
      context: ../apps/worker
      dockerfile: ../../docker/Dockerfile.worker
    container_name: concierge-worker
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://concierge:concierge_dev_password@postgres:5432/concierge
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=concierge-media
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LOG_LEVEL=DEBUG
      - WORKER_CONCURRENCY=4
    volumes:
      - ../apps/worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  websocket:
    build:
      context: ../apps/websocket
      dockerfile: ../../docker/Dockerfile.websocket
    container_name: concierge-websocket
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - LOG_LEVEL=DEBUG
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    volumes:
      - ../apps/websocket:/app
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../docker/Dockerfile.frontend
    container_name: concierge-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8001
      - VITE_APP_TITLE=Smart City Concierge
    ports:
      - "3000:80"
    depends_on:
      - api
      - websocket
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==========================================
  # OBSERVABILITY STACK
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: concierge-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:10.2.0
    container_name: concierge-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  loki:
    image: grafana/loki:2.9.0
    container_name: concierge-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  promtail:
    image: grafana/promtail:2.9.0
    container_name: concierge-promtail
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
      - ../apps/api:/var/log/api:ro
      - ../apps/worker:/var/log/worker:ro
      - ../apps/websocket:/var/log/websocket:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: concierge-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/data/badger
    volumes:
      - jaeger_data:/data
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    networks:
      - concierge-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  jaeger_data:

networks:
  concierge-network:
    driver: bridge
    name: concierge-network